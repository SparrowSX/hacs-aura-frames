name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so breakage from new Home Assistant or HACS releases surfaces
    # even when the repository is idle.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # The aura_frames domain is not in home-assistant/brands (that needs a
          # separate PR there); drop this line once it is accepted.
          ignore: brands
