name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so breakage from new Home Assistant or HACS releases surfaces
    # even when the repository is idle.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component pulls in the Home Assistant
          # core it tests against, which sets the floor for this version.
          python-version: "3.14"
          cache: pip
          # Without this the cache step looks for requirements.txt only, and
          # fails the job before a single test runs.
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest
